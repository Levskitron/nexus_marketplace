<nav class="navbar">

    <!-- Left: Nexus Brand -->
    <div class="nav-left">
        <a href="{{ url_for('home.home') }}" class="brand">Nexus</a>
    </div>

    <!-- Middle: Logo -->
    <div class="nav-center">
        <img src="{{ url_for('static', filename='images/logo_placeholder.png') }}" 
             alt="Logo" class="logo-box">
    </div>

    <!-- Right: User Section -->
    <div class="nav-right">

        {% if session.get("user_id") %}
            <!-- LOGGED-IN DROPDOWN -->
            <div class="user-menu">
                <div class="user-trigger">
                    {{ session.get("username") }} ▼
                </div>

                <div class="user-dropdown">
                    <a href="{{ url_for('account.my_account') }}">My Account</a>
                    <a href="#">My Orders</a>
                    <a href="{{ url_for('auth.logout') }}">Logout</a>
                </div>
            </div>

        {% else %}
            <!-- NOT LOGGED IN -->
            <a href="{{ url_for('auth.register_page') }}" class="login-btn">
                Login / Signup
            </a>
        {% endif %}

    </div>

</nav>

<!-- Second Row (Links) -->
<div class="nav-links">
    <a href="{{ url_for('home.home') }}">Home</a>
    <a href="{{ url_for('shop.shop') }}">Shop</a>
    <a href="{{ url_for('home.about') }}">About</a>
    <a href="{{ url_for('home.contact') }}">Contact</a>
</div>
