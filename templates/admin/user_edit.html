<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ target.username }} – Nexus Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-page">

    {% include "components/navbar.html" %}

    <main class="admin-main">

        <header class="admin-header">
            <h1>Edit user</h1>
            <p class="admin-subtitle">{{ target.username }} (ID: {{ target.user_id }})</p>
        </header>

        <nav class="admin-nav">
            <a href="{{ url_for('admin.users') }}" class="admin-nav-btn--secondary">← Back to users</a>
        </nav>

        <section class="admin-card">
            <form method="POST" class="admin-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ target.username }}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ target.email }}" required>
                </div>
                <button type="submit" class="btn-update">Save changes</button>
            </form>
        </section>

    </main>

</body>
</html>
